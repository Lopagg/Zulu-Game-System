name: Build, Release and Bump Version

on:
  push:
    tags:
      - 'v*' # Si innesca creando un tag come v0.3.7

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Aggiorna app_common.h e firmware.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/#define FIRMWARE_VERSION .*/#define FIRMWARE_VERSION \"$VERSION\"/" src/app_common.h
          echo "{" > firmware.json
          echo "  \"version\": \"$VERSION\"," >> firmware.json
          echo "  \"url\": \"https://github.com/Lopagg/Zulu-Game-System/releases/download/v$VERSION/firmware.bin\"" >> firmware.json
          echo "}" >> firmware.json

      - name: Push delle modifiche al repository
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: bump version to ${{ env.VERSION }}"
          file_pattern: src/app_common.h firmware.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installa PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compila il firmware
        run: pio run

      - name: Pubblica la Release
        uses: softprops/action-gh-release@v1
        with:
          files: .pio/build/esp32dev/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}