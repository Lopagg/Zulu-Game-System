name: Build, Release and Bump Version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          ref: main 

      - name: Aggiorna app_common.h e firmware.json
        run: |
          # Estrai la versione (da "v0.3.9" diventa "0.3.9")
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Aggiorna il file C++
          sed -i "s/#define FIRMWARE_VERSION .*/#define FIRMWARE_VERSION \"$VERSION\"/" src/app_common.h
          
          # Assicurati che la cartella firmware esista
          mkdir -p firmware
          
          # Rigenera il manifesto nel percorso corretto
          echo "{" > firmware/firmware.json
          echo "  \"version\": \"$VERSION\"," >> firmware/firmware.json
          echo "  \"url\": \"https://github.com/Lopagg/Zulu-Game-System/releases/download/v$VERSION/firmware.bin\"" >> firmware/firmware.json
          echo "}" >> firmware/firmware.json

      - name: Push delle modifiche al repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # github.ref_name contiene già il nome del tag (es. v0.3.9), è nativo e non genera warning in VS Code
          commit_message: "chore: bump version to ${{ github.ref_name }}"
          branch: main 
          # Modificato il file pattern per includere il percorso corretto
          file_pattern: src/app_common.h firmware/firmware.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compila il firmware
        run: pio run

      - name: Pubblica la Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/esp32dev/firmware.bin
          name: Release ${{ github.ref_name }}