<div id="view-setup" class="view-panel hidden">
    <div class="sop-card setup-panel">
        <div class="panel-header">
            <h2>MISSION CONFIGURATION</h2>
            <button class="back-btn deck-btn" onclick="showView('hub')">[ CANCEL ]</button>
        </div>
        <div class="panel-body">
            
            <div class="setup-roster-summary">
                <div class="setup-roster-team">
                    <div class="setup-roster-label">ALPHA READY</div>
                    <div id="setup-alpha-count" class="setup-roster-count setup-roster-alpha">0/0</div>
                </div>
                <div class="setup-roster-team">
                    <div class="setup-roster-label">BRAVO READY</div>
                    <div id="setup-bravo-count" class="setup-roster-count setup-roster-bravo">0/0</div>
                </div>
            </div>
            
            <div class="input-group-tactical" style="margin-bottom: 25px;">
                <label class="setup-label">SELECT OPERATION MODE:</label>
                <select id="setup-mode-select" class="tactical-select">
                    <option value="sd">SEARCH & DESTROY</option>
                    <option value="dom">DOMINATION</option>
                    <option value="tdm">TEAM DEATHMATCH</option>
                </select>
            </div>

            <div id="target-selection-row" class="input-group-tactical" style="margin-bottom: 25px;">
                <label class="setup-label">SELECT TARGET TERMINAL:</label>
                <select id="setup-target-select" class="tactical-select">
                    <option value="">-- Seleziona un nodo nel Menu Principale --</option>
                </select>
            </div>

            <hr class="separator">

            <div id="setup-tdm-params" class="setup-params-group hidden">
                <h3 style="color: var(--sop-primary); margin-bottom: 20px;">TDM PARAMETERS</h3>
                <div class="row-inputs" style="margin-bottom: 15px;">
                    <div style="flex:1;">
                        <label class="setup-label">GAME DURATION (MIN)</label>
                        <input type="number" id="tdm-game-dur" class="setup-input" value="15" min="1">
                    </div>
                </div>
                <p style="color:#888; font-size:12px; margin-top:10px;">* Team Deathmatch non richiede un terminale fisico. Il server calcolerà il tempo e le eliminazioni in automatico.</p>
            </div>

            <div id="setup-sd-params" class="setup-params-group">
                <h3 style="color: var(--sop-primary); margin-bottom: 20px;">S&D PARAMETERS</h3>
                <div class="row-inputs" style="margin-bottom: 20px;">
                    <div style="flex:1;">
                        <label class="setup-label" style="color: var(--sop-alert);">ATTACKING TEAM (PLANTS BOMB)</label>
                        <select id="sd-attacker-team" class="tactical-select">
                            <option value="ALPHA">TEAM ALPHA</option>
                            <option value="BRAVO">TEAM BRAVO</option>
                        </select>
                    </div>
                </div>
                <div class="row-inputs" style="margin-bottom: 15px;">
                    <div style="flex:1;"><label class="setup-label">GAME DURATION (MIN)</label><input type="number" id="sd-game-dur" class="setup-input" value="20" min="1"></div>
                    <div style="flex:1;"><label class="setup-label">BOMB TIMER (MIN)</label><input type="number" id="sd-bomb-time" class="setup-input" value="10" min="1"></div>
                </div>
                <div class="row-inputs" style="margin-bottom: 15px;">
                    <div style="flex:1;"><label class="setup-label">ARM TIME (SEC)</label><input type="number" id="sd-arm-time" class="setup-input" value="5" min="1"></div>
                    <div style="flex:1;"><label class="setup-label">DEFUSE TIME (SEC)</label><input type="number" id="sd-defuse-time" class="setup-input" value="10" min="1"></div>
                </div>
                <div class="row-inputs" style="margin-bottom: 15px;">
                    <div style="flex:1;">
                        <label class="setup-label">USE ARM PIN</label>
                        <select id="sd-use-arm-pin" class="tactical-select"><option value="true">YES</option><option value="false">NO</option></select>
                    </div>
                    <div style="flex:1;">
                        <label class="setup-label">USE DEFUSE PIN</label>
                        <select id="sd-use-defuse-pin" class="tactical-select"><option value="true">YES</option><option value="false">NO</option></select>
                    </div>
                </div>
                <div class="row-inputs" style="margin-bottom: 20px;">
                    <div style="flex:1;"><label class="setup-label">ARM PIN</label><input type="number" id="sd-arm-pin" class="setup-input" value="1234"></div>
                    <div style="flex:1;"><label class="setup-label">DEFUSE PIN</label><input type="number" id="sd-defuse-pin" class="setup-input" value="4321"></div>
                </div>
            </div>

            <div id="setup-dom-params" class="setup-params-group hidden">
                <h3 style="color: var(--sop-primary); margin-bottom: 20px;">DOMINATION PARAMETERS</h3>
                <div class="row-inputs" style="margin-bottom: 15px;">
                    <div style="flex:1;"><label class="setup-label">GAME DURATION (MIN)</label><input type="number" id="dom-game-dur" class="setup-input" value="15" min="1"></div>
                    <div style="flex:1;"><label class="setup-label">CAPTURE TIME (SEC)</label><input type="number" id="dom-capture-time" class="setup-input" value="10" min="1"></div>
                    <div style="flex:1;"><label class="setup-label">COUNTDOWN (SEC)</label><input type="number" id="dom-countdown" class="setup-input" value="10" min="1"></div>
                </div>
            </div>

            <div class="setup-actions" style="margin-top: 30px; text-align: right;">
                <button id="btn-transmit-setup" class="deck-btn" style="border-color: var(--sop-secondary); color: var(--sop-secondary);">[ 1. TRANSMIT CONFIG ]</button>
                <button id="btn-start-mission" class="deck-btn disabled" disabled style="border-color: var(--sop-primary); color: var(--sop-primary); font-weight:bold; font-size: 16px; padding: 10px 20px; margin-left: 10px;">[ 2. START MISSION ]</button>
            </div>
        </div>
    </div>
</div>
