<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulu Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>ZULU LIVE DASHBOARD</h1>
            <div id="connection-status" class="status-indicator offline">OFFLINE</div>
        </header>

        <main>
            <div class="card timer-card">
                <h2>Tempo Rimanente</h2>
                <div id="main-timer" class="big-text">--:--</div>
                <div id="game-status" class="status-text">In attesa...</div>
            </div>

            <div class="card domination-card" id="domination-panel" style="display:none;">
                <h3>Dominio</h3>
                <div class="scores">
                    <div class="team team-1">
                        <h4>Squadra 1</h4>
                        <span id="score-t1">0s</span>
                    </div>
                    <div class="team team-2">
                        <h4>Squadra 2</h4>
                        <span id="score-t2">0s</span>
                    </div>
                </div>
            </div>

            <div class="card controls-card">
                <h3>Comandi</h3>
                <button onclick="sendCommand('FORCE_END_GAME')">TERMINA PARTITA</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
