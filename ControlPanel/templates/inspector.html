<div id="view-inspector" class="view-panel hidden">
    <div class="inspector-header">
        <h2 id="inspector-title">NODE-UNKNOWN // CONFIG</h2>
        <button class="close-inspector-btn" onclick="showView('hub')">[CLOSE LINK]</button>
    </div>
    <div class="inspector-grid">
        <div class="sop-card profile-panel">
            <h3>ASSET PROFILE</h3>
            <div class="profile-content">
                <div class="asset-illustration"><div class="tech-circle">NODE</div></div>
                <div class="asset-desc">
                    <h4>REMOTE ACCESS TERMINAL V1</h4>
                    <p class="desc-text">Terminale tattico multi-ruolo basato su architettura ESP32.</p>
                    <div class="specs"><span>HW_VER: 1.0</span><span id="insp-fw-ver">FW_VER: --</span></div>
                </div>
            </div>
        </div>
        <div class="sop-card config-panel">
            <h3>CONFIGURATION & MAINTENANCE</h3>
            <div class="data-row"><span class="label">STATUS:</span> <span id="insp-state" class="value">--</span></div>
            <div class="data-row"><span class="label">CURRENT IP:</span> <span id="insp-ip" class="value">--</span></div>
            <div class="data-row"><span class="label">CURRENT MODE:</span> <span id="insp-mode" class="value">--</span></div>
            <hr class="separator">
            <div class="input-group-tactical">
                <label>ASSET ALIAS</label>
                <div class="row-inputs">
                    <input type="text" id="insp-alias-input" placeholder="Es. NODE-ALPHA">
                    <button id="save-alias-btn" class="deck-btn">[SAVE]</button>
                </div>
            </div>
            <hr class="separator">
            <div class="danger-zone">
                <label class="danger-label">HARDWARE OVERRIDE</label>
                <button id="hard-reset-btn" class="deck-btn btn-danger">[ HARDWARE RESET ]</button>
            </div>
        </div>
    </div>
</div>
